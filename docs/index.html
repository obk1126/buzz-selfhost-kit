<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AX Crew</title>
<style>
  :root {
    --bg: #F0ECDE; --side: #E9E4D1; --card: #FCFAF2;
    --bubble: #FCFAF2; --bubble-me: #DCE0C2;
    --ink: #3C3A2E; --sub: #8A8470; --line: #DDD6BE;
    --olive: #6B7A3A; --olive-deep: #4C5827; --olive-ink: #F7F4E4;
    --gyeol: #8A7B4E; --gyeol-deep: #6B5F3A; --me: #B2A77E;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Pretendard", -apple-system, "Noto Sans KR", sans-serif;
    font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; overflow: hidden;
  }

  /* ── 앱 셸 ── */
  .app { display: flex; height: 100dvh; }
  aside {
    width: 300px; flex: none; background: var(--side);
    display: flex; flex-direction: column; padding: 24px 16px 20px;
    border-right: 2px solid var(--line);
  }
  .brand { display: flex; gap: 12px; align-items: center; padding: 0 8px 24px; }
  .logo {
    width: 48px; height: 48px; border-radius: 16px; background: var(--olive);
    border-bottom: 4px solid var(--olive-deep); color: var(--olive-ink);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 20px; letter-spacing: .02em;
  }
  .brand b { display: block; font-size: 20px; font-weight: 800; line-height: 1.25; }
  .conn { font-size: 14px; font-weight: 700; color: var(--sub); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #BFB89E; transition: background .4s; }
  .dot.on { background: #6B9B37; }
  .sect { font-size: 14px; font-weight: 800; color: var(--sub); letter-spacing: .08em; padding: 20px 10px 8px; }
  .chan {
    display: flex; width: 100%; align-items: center; gap: 12px; text-align: left;
    font: inherit; font-size: 16px; font-weight: 700; color: var(--ink);
    background: none; border: 2px solid transparent; border-radius: 16px;
    padding: 12px 12px; cursor: pointer; margin-bottom: 4px;
    transition: background .2s var(--ease), transform .2s var(--ease), border-color .2s;
  }
  .chan:hover { background: rgba(60,58,46,.06); }
  .chan:active { transform: scale(.98); }
  .chan.on { background: var(--olive); border-color: var(--olive-deep); color: var(--olive-ink); }
  .chan.on small, .chan.on .hash { color: #DDE3C2; }
  .chan .hash { color: var(--sub); font-weight: 900; font-size: 16px; width: 20px; text-align: center; }
  .chan small { font-size: 14px; font-weight: 600; color: var(--sub); margin-left: auto; }
  .avch { width: 34px; height: 34px; border-radius: 50%; flex: none; color: var(--olive-ink);
          display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; position: relative; }
  .avch i { position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 50%;
            background: #BFB89E; border: 2.5px solid var(--side); }
  .avch i.on { background: #6B9B37; }
  .links { margin-top: auto; padding: 16px 10px 0; display: flex; gap: 12px; flex-wrap: wrap; }
  .links a { font-size: 14px; font-weight: 700; color: var(--sub); text-decoration: none; }
  .links a:hover { color: var(--olive); }
  .fineprint { font-size: 14px; color: var(--sub); opacity: .75; padding: 8px 10px 0; }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    padding: 16px 24px; border-bottom: 2px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  .menu { display: none; }
  header h1 { font-size: 18px; font-weight: 800; }
  .pills { margin-left: auto; display: flex; gap: 8px; }
  .pill { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--sub);
          border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px; background: var(--card); }

  .log { flex: 1; overflow-y: auto; padding: 24px; scroll-behavior: smooth; }
  .logcol { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-height: 100%; }
  .intro { margin: auto; text-align: center;
           opacity: 0; transform: translateY(14px) scale(.97); animation: arrive .6s var(--ease) .05s forwards; }
  .intro .ic { width: 88px; height: 88px; border-radius: 28px; background: var(--card);
               border: 2px solid var(--line); border-bottom-width: 5px;
               display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
               font-size: 32px; font-weight: 900; color: var(--olive); }
  .intro h2 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  .intro p { font-size: 15px; font-weight: 600; color: var(--sub); }
  .m { display: flex; gap: 12px; max-width: 88%;
       opacity: 0; transform: translateY(12px) scale(.98); transform-origin: left bottom;
       animation: arrive .45s var(--ease) forwards; }
  @keyframes arrive { to { opacity: 1; transform: none; } }
  .m.me { align-self: flex-end; flex-direction: row-reverse; transform-origin: right bottom; }
  .av { flex: none; width: 42px; height: 42px; border-radius: 50%; color: var(--olive-ink);
        display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800;
        border-bottom: 3px solid rgba(0,0,0,.18); }
  .who { font-size: 14px; font-weight: 800; }
  .who time { font-weight: 600; color: var(--sub); margin-left: 6px; font-size: 14px; }
  .m.me .who { display: none; }
  .bub { border: 2px solid var(--line); border-radius: 4px 18px 18px 18px;
         padding: 12px 16px; margin-top: 4px; font-size: 15px; font-weight: 500;
         white-space: pre-wrap; background: var(--bubble); line-height: 1.7; }
  .m.me .bub { background: var(--bubble-me); border-color: #C7CCA3; border-radius: 18px 4px 18px 18px; margin-top: 0; }
  .sys { align-self: center; font-size: 14px; font-weight: 700; color: var(--sub);
         border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 16px;
         opacity: 0; animation: arrive .45s var(--ease) forwards; }
  .typing { display: inline-flex; gap: 5px; padding: 6px 2px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--sub);
              animation: tp 1.2s infinite var(--ease); }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes tp { 0%,60%,100% { opacity: .3; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }

  .composer { padding: 12px 24px 24px; }
  .crow { max-width: 820px; margin: 0 auto; display: flex; gap: 12px; align-items: flex-end;
          background: var(--card); border: 2px solid var(--line); border-bottom-width: 4px;
          border-radius: 20px; padding: 10px 10px 10px 20px;
          transition: border-color .25s var(--ease); }
  .crow:focus-within { border-color: var(--olive); }
  .crow textarea {
    flex: 1; font: inherit; font-size: 16px; font-weight: 600; border: none; outline: none; background: none;
    resize: none; max-height: 120px; line-height: 1.5; padding: 8px 0; color: var(--ink);
  }
  .crow textarea::placeholder { color: var(--sub); font-weight: 600; }
  .sendbtn {
    width: 44px; height: 44px; border-radius: 14px; border: none; cursor: pointer; flex: none;
    background: var(--olive); border-bottom: 4px solid var(--olive-deep); color: var(--olive-ink);
    font-size: 18px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s var(--ease), opacity .2s, border-bottom-width .15s;
  }
  .sendbtn:active { transform: translateY(2px); border-bottom-width: 2px; }
  .sendbtn:disabled { opacity: .3; cursor: default; transform: none; border-bottom-width: 4px; }

  /* ── 게이트 ── */
  .gate {
    position: fixed; inset: 0; z-index: 10; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    transition: opacity .55s var(--ease), transform .55s var(--ease);
  }
  .gate.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
  .gcard { width: min(360px, calc(100vw - 48px)); text-align: center; }
  .glogo { width: 88px; height: 88px; border-radius: 28px; background: var(--olive);
           border-bottom: 6px solid var(--olive-deep); color: var(--olive-ink);
           display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
           font-size: 32px; font-weight: 900; }
  .gcard h1 { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
  .gcard .gsub { font-size: 15px; font-weight: 700; color: var(--sub); margin-bottom: 32px; }
  .gcard input {
    width: 100%; font: inherit; font-size: 18px; font-weight: 800; text-align: center; letter-spacing: .08em;
    padding: 14px 16px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px;
    background: var(--card); color: var(--ink); outline: none; margin-bottom: 12px;
    transition: border-color .25s var(--ease);
  }
  .gcard input:focus { border-color: var(--olive); }
  .gcard input::placeholder { color: var(--sub); font-weight: 700; letter-spacing: 0; }
  .gbtn {
    width: 100%; font: inherit; font-size: 16px; font-weight: 800; letter-spacing: .06em;
    border: none; cursor: pointer; background: var(--olive); color: var(--olive-ink);
    border-bottom: 4px solid var(--olive-deep); border-radius: 16px; padding: 14px;
    transition: transform .15s var(--ease), border-bottom-width .15s, filter .2s;
  }
  .gbtn:hover { filter: brightness(1.05); }
  .gbtn:active { transform: translateY(2px); border-bottom-width: 2px; }
  .gerr { font-size: 14px; font-weight: 700; color: #9C402E; margin-top: 12px; min-height: 22px; }
  .shake { animation: shake .45s var(--ease); }
  @keyframes shake { 0%,100%{transform:none} 25%{transform:translateX(-8px)} 55%{transform:translateX(6px)} 80%{transform:translateX(-3px)} }
  .glinks { margin-top: 36px; display: flex; gap: 16px; justify-content: center; }
  .glinks a { font-size: 14px; font-weight: 700; color: var(--sub); text-decoration: none; }
  .glinks a:hover { color: var(--olive); }

  /* ── 모바일 ── */
  .backdrop { display: none; }
  @media (max-width: 880px) {
    aside { position: fixed; inset: 0 auto 0 0; z-index: 6; transform: translateX(-100%);
            transition: transform .4s var(--ease); width: 290px; }
    aside.open { transform: none; box-shadow: 24px 0 48px rgba(60,58,46,.18); }
    .backdrop { display: block; position: fixed; inset: 0; z-index: 5; background: rgba(60,58,46,.28);
                opacity: 0; pointer-events: none; transition: opacity .4s var(--ease); }
    .backdrop.show { opacity: 1; pointer-events: auto; }
    .menu { display: flex; border: none; background: none; cursor: pointer; padding: 6px;
            flex-direction: column; gap: 4px; }
    .menu i { width: 20px; height: 3px; background: var(--ink); border-radius: 3px; }
    .pills { display: none; }
    .log { padding: 16px; } .composer { padding: 8px 16px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .m, .sys, .intro { animation: none !important; opacity: 1 !important; transform: none !important; }
    .gate, .chan, .sendbtn, .gbtn { transition: none !important; }
  }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gcard">
    <div class="glogo">AX</div>
    <h1>AX Crew</h1>
    <p class="gsub">라이브 멀티에이전트 워크스페이스</p>
    <div id="grow">
      <input type="password" id="gcode" placeholder="접근코드" autocomplete="off">
      <button class="gbtn" id="genter">입장하기</button>
    </div>
    <div class="gerr" id="gerr"></div>
    <div class="glinks">
      <a href="about/">소개</a>
      <a href="https://github.com/obk1126/buzz-selfhost-kit">GitHub</a>
      <a href="mailto:oobin765@gmail.com">문의</a>
    </div>
  </div>
</div>

<div class="app">
  <div class="backdrop" id="backdrop"></div>
  <aside id="sb">
    <div class="brand">
      <div class="logo">AX</div>
      <div><b>AX Crew</b><span class="conn"><span class="dot" id="conndot"></span><span id="conntxt">연결 중</span></span></div>
    </div>
    <div class="sect">채널</div>
    <button class="chan" data-ch="lounge"><span class="hash">#</span> 크루-라운지</button>
    <button class="chan" data-ch="review"><span class="hash">#</span> 검증-파이프라인</button>
    <div class="sect">크루</div>
    <button class="chan" data-ch="naru"><span class="avch" style="background:var(--olive)">나<i id="p-naru"></i></span> 나루 <small>안내·문서</small></button>
    <button class="chan" data-ch="gyeol" disabled style="cursor:default"><span class="avch" style="background:var(--gyeol)">결<i id="p-gyeol"></i></span> 결 <small>검증</small></button>
    <div class="links">
      <a href="about/">소개</a>
      <a href="https://github.com/obk1126/buzz-selfhost-kit">GitHub</a>
      <a href="mailto:oobin765@gmail.com">문의</a>
    </div>
    <div class="fineprint">격리 데모 · 개인정보 입력 금지</div>
  </aside>

  <main>
    <header>
      <button class="menu" id="menubtn" aria-label="메뉴"><i></i><i></i><i></i></button>
      <h1 id="chname"></h1>
      <div class="pills">
        <span class="pill"><span class="dot" id="hd-naru"></span>나루</span>
        <span class="pill"><span class="dot" id="hd-gyeol"></span>결</span>
      </div>
    </header>
    <div class="log" id="log"><div class="logcol" id="logcol"></div></div>
    <div class="composer">
      <div class="crow">
        <textarea id="input" rows="1" maxlength="300"></textarea>
        <button class="sendbtn" id="send" aria-label="보내기">↑</button>
      </div>
    </div>
  </main>
</div>

<script>
const API = "https://duo-km.duckdns.org/axdemo";
const $ = id => document.getElementById(id);
const sid = (localStorage.getItem("ax-sid") || (() => { const s = Math.random().toString(36).slice(2,10); localStorage.setItem("ax-sid", s); return s; })());
let code = localStorage.getItem("ax-code") || "";

const AG = {
  naru:  { name: "나루", color: "var(--olive)", deep: "var(--olive-deep)", av: "나" },
  gyeol: { name: "결",   color: "var(--gyeol)", deep: "var(--gyeol-deep)", av: "결" },
  me:    { name: "나",   color: "var(--me)",    deep: "#8F8560",           av: "나" },
};
const CH = {
  lounge: { name: "# 크루-라운지", ph: "크루에게 말 걸기", kind: "lounge",
            introIc: "#", introH: "크루-라운지", introP: "무엇이든 물어보세요" },
  review: { name: "# 검증-파이프라인", ph: "과제 입력 — 예: 신입 온보딩 안내문 초안", kind: "review",
            introIc: "#", introH: "검증-파이프라인", introP: "과제를 입력하면 협업이 시작됩니다" },
  naru:   { name: "나루", ph: "나루에게 메시지", kind: "dm",
            introIc: "나", introH: "나루", introP: "안내·문서 담당" },
};
const msgs = { lounge: [], review: [], naru: [] };
const busy = { lounge: false, review: false, naru: false };
let cur = "lounge";

function el(tag, cls, html) { const d = document.createElement(tag); if (cls) d.className = cls; if (html !== undefined) d.innerHTML = html; return d; }
function now() { const d = new Date(); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
function bubble(m) {
  if (m.who === "sys") { const s = el("div", "sys"); s.textContent = m.text; return s; }
  const a = AG[m.who];
  const w = el("div", "m" + (m.who === "me" ? " me" : ""));
  const av = el("div", "av", a.av); av.style.background = a.color;
  const body = el("div");
  if (m.who !== "me") {
    const who = el("div", "who"); who.style.color = a.color;
    who.innerHTML = a.name + (m.t ? ` <time>${m.t}</time>` : "");
    body.appendChild(who);
  }
  const b = el("div", "bub");
  if (m.typing) b.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  else b.textContent = m.text;
  body.appendChild(b);
  w.appendChild(av); w.appendChild(body);
  return w;
}
function push(ch, m) {
  msgs[ch].push(m);
  if (ch === cur) {
    const emptyIntro = $("logcol").querySelector(".intro");
    if (emptyIntro) emptyIntro.remove();
    const n = bubble(m); $("logcol").appendChild(n); $("log").scrollTop = 1e9; m._node = n; return n;
  }
}
function renderChannel() {
  const c = CH[cur];
  $("chname").textContent = c.name;
  $("input").placeholder = c.ph;
  document.querySelectorAll(".chan").forEach(b => b.classList.toggle("on", b.dataset.ch === cur));
  const col = $("logcol"); col.innerHTML = "";
  if (!msgs[cur].length) {
    const i = el("div", "intro");
    const ic = el("div", "ic", c.introIc);
    if (cur === "naru") { ic.style.background = "var(--olive)"; ic.style.color = "var(--olive-ink)"; ic.style.borderColor = "var(--olive-deep)"; }
    i.appendChild(ic);
    i.appendChild(el("h2", "", c.introH));
    i.appendChild(el("p", "", c.introP));
    col.appendChild(i);
  } else msgs[cur].forEach(m => { const n = bubble(m); col.appendChild(n); m._node = n; });
  $("log").scrollTop = 1e9;
  $("sb").classList.remove("open"); $("backdrop").classList.remove("show");
  updateSend();
}
document.querySelectorAll(".chan[data-ch]").forEach(b => {
  if (b.disabled) return;
  b.onclick = () => { cur = b.dataset.ch; renderChannel(); };
});
$("menubtn").onclick = () => { $("sb").classList.add("open"); $("backdrop").classList.add("show"); };
$("backdrop").onclick = () => { $("sb").classList.remove("open"); $("backdrop").classList.remove("show"); };

async function post(path, body) {
  const r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ code }, body)) });
  const j = await r.json().catch(() => ({ error: "서버 응답 오류" }));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
async function health() {
  try {
    const r = await fetch(API + "/health"); await r.json();
    ["conndot","p-naru","p-gyeol","hd-naru","hd-gyeol"].forEach(i => $(i).classList.add("on"));
    $("conntxt").textContent = "온라인";
  } catch (e) { $("conntxt").textContent = "연결 안 됨"; }
}

function typingMsg(ch, who) { const m = { who, typing: true }; push(ch, m); return m; }
function removeMsg(ch, m) {
  const i = msgs[ch].indexOf(m); if (i >= 0) msgs[ch].splice(i, 1);
  if (m._node && m._node.parentNode) m._node.remove();
}
async function sendDM(text) {
  busy.naru = true; updateSend();
  const t = typingMsg("naru", "naru");
  try { const j = await post("/chat", { session: sid, message: text }); removeMsg("naru", t); push("naru", { who: "naru", text: j.reply, t: now() }); }
  catch (e) { removeMsg("naru", t); push("naru", { who: "sys", text: e.message }); }
  busy.naru = false; updateSend();
}
async function sendThread(ch, text) {
  busy[ch] = true; updateSend();
  let t = typingMsg(ch, "naru");
  try {
    const { id } = await post("/thread", { kind: CH[ch].kind, session: sid, message: text });
    let shown = 0;
    await new Promise((resolve) => {
      const iv = setInterval(async () => {
        try {
          const r = await fetch(`${API}/thread/${id}`); const j = await r.json();
          for (; shown < j.steps.length; shown++) {
            if (t) { removeMsg(ch, t); t = null; }
            const s = j.steps[shown];
            if (s.agent === "system") push(ch, { who: "sys", text: s.text });
            else push(ch, { who: s.agent, text: s.text, t: now() });
          }
          if (j.status === "running") {
            if (!t) t = typingMsg(ch, shown === 1 ? "gyeol" : "naru");
          } else {
            if (t) { removeMsg(ch, t); t = null; }
            clearInterval(iv); resolve();
          }
        } catch (e) { clearInterval(iv); if (t) removeMsg(ch, t); push(ch, { who: "sys", text: "연결 오류" }); resolve(); }
      }, 3500);
    });
  } catch (e) { if (t) removeMsg(ch, t); push(ch, { who: "sys", text: e.message }); }
  busy[ch] = false; updateSend();
}
function updateSend() { $("send").disabled = busy[cur] || !$("input").value.trim(); }
$("input").addEventListener("input", () => {
  const i = $("input"); i.style.height = "auto"; i.style.height = Math.min(i.scrollHeight, 120) + "px";
  updateSend();
});
function submit() {
  const text = $("input").value.trim();
  if (!text || busy[cur]) return;
  $("input").value = ""; $("input").style.height = "auto"; updateSend();
  push(cur, { who: "me", text, t: now() });
  if (CH[cur].kind === "dm") sendDM(text); else sendThread(cur, text);
}
$("send").onclick = submit;
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
});

async function tryEnter(c) {
  if (!c) return false;
  try {
    const r = await fetch(API + "/verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: c }) });
    if (!r.ok) throw new Error((await r.json()).error || "인증 실패");
    code = c; localStorage.setItem("ax-code", c);
    $("gate").classList.add("out");
    setTimeout(() => { const g = $("gate"); if (g) g.remove(); }, 650);
    return true;
  } catch (e) {
    $("gerr").textContent = e.message === "Failed to fetch" ? "서버에 연결할 수 없습니다" : e.message;
    $("grow").classList.remove("shake"); void $("grow").offsetWidth; $("grow").classList.add("shake");
    return false;
  }
}
$("genter").onclick = () => tryEnter($("gcode").value.trim());
$("gcode").addEventListener("keydown", e => { if (e.key === "Enter") tryEnter($("gcode").value.trim()); });

renderChannel(); health(); setInterval(health, 60000);
const urlKey = new URLSearchParams(location.search).get("k");
if (urlKey) { $("gcode").value = urlKey; tryEnter(urlKey); }
else if (code) { $("gcode").value = code; tryEnter(code); }
</script>
</body>
</html>

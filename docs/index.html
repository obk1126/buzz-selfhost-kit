<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AX Crew — 라이브 멀티에이전트 워크스페이스</title>
<style>
  :root {
    --bg: #F0ECDE; --side: #E7E2CF; --panel: #E9E4D2;
    --bubble: #FCFAF2; --bubble-me: #DCE0C2;
    --ink: #2B2A20; --sub: #6F6A55; --olive: #55602F; --line: #DBD4BE;
    --naru: #55602F; --gyeol: #8A7B4E; --me: #B2A77E;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Pretendard", -apple-system, "Noto Sans KR", sans-serif;
    font-size: 16px; line-height: 1.7; -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  .serif { font-family: "Noto Serif KR", "Apple SD Gothic Neo", Georgia, serif; }

  /* ── 앱 셸 ─────────────────────────── */
  .app { display: flex; height: 100dvh; }
  aside {
    width: 272px; flex: none; background: var(--side);
    display: flex; flex-direction: column; padding: 20px 12px 16px;
    border-right: 1px solid var(--line);
  }
  .brand { display: flex; gap: 12px; align-items: center; padding: 4px 8px 20px; }
  .logo {
    width: 40px; height: 40px; border-radius: 12px; background: var(--olive); color: #F5F2E4;
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, serif; font-weight: 700; font-size: 16px; letter-spacing: .02em;
  }
  .brand b { display: block; font-size: 16px; line-height: 1.3; }
  .conn { font-size: 14px; color: var(--sub); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #B9B29A; transition: background .4s; }
  .dot.on { background: #5E7D34; }
  .sect { font-size: 14px; color: var(--sub); padding: 16px 8px 6px; font-weight: 600; }
  .chan {
    display: flex; width: 100%; align-items: center; gap: 10px; text-align: left;
    font: inherit; font-size: 16px; color: var(--ink); background: none; border: none;
    padding: 9px 10px; border-radius: 10px; cursor: pointer;
    transition: background .25s var(--ease), transform .25s var(--ease);
  }
  .chan:hover { background: rgba(43,42,32,.05); }
  .chan:active { transform: scale(.985); }
  .chan.on { background: var(--olive); color: #F5F2E4; }
  .chan.on small, .chan.on .hash { color: #D9DCC2; }
  .chan .hash { color: var(--sub); font-weight: 600; }
  .chan small { font-size: 14px; color: var(--sub); margin-left: auto; }
  .avch { width: 26px; height: 26px; border-radius: 50%; flex: none; color: #F5F2E4;
          display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; position: relative; }
  .avch i { position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%;
            background: #B9B29A; border: 2px solid var(--side); }
  .avch i.on { background: #5E7D34; }
  .links { margin-top: auto; padding: 16px 8px 0; display: flex; flex-direction: column; gap: 8px; }
  .links a { font-size: 14px; color: var(--sub); text-decoration: none; }
  .links a:hover { color: var(--olive); }
  .fineprint { font-size: 14px; color: var(--sub); opacity: .7; padding: 12px 8px 0; line-height: 1.5; }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    padding: 16px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; background: var(--bg);
  }
  .menu { display: none; }
  header h1 { font-size: 16px; font-weight: 700; }
  header p { font-size: 14px; color: var(--sub); }

  .log { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px;
         scroll-behavior: smooth; }
  .intro {
    align-self: center; max-width: 440px; text-align: center; margin: auto;
    opacity: 0; transform: translateY(14px); animation: arrive .7s var(--ease) .1s forwards;
  }
  .intro .ic { width: 56px; height: 56px; border-radius: 18px; background: var(--panel);
               display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
               font-size: 20px; color: var(--olive); font-weight: 700; }
  .intro h2 { font-size: 20px; margin-bottom: 8px; }
  .intro p { font-size: 14px; color: var(--sub); }
  .m { display: flex; gap: 10px; max-width: 86%;
       opacity: 0; transform: translateY(12px) scale(.98); transform-origin: left bottom;
       animation: arrive .5s var(--ease) forwards; }
  @keyframes arrive { to { opacity: 1; transform: none; } }
  .m.me { align-self: flex-end; flex-direction: row-reverse; transform-origin: right bottom; }
  .av { flex: none; width: 34px; height: 34px; border-radius: 50%; color: #F5F2E4;
        display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
  .who { font-size: 14px; font-weight: 600; }
  .who time { font-weight: 400; color: var(--sub); margin-left: 6px; }
  .m.me .who { text-align: right; color: var(--sub); }
  .bub { border-radius: 4px 16px 16px 16px; padding: 10px 14px; margin-top: 4px;
         font-size: 15px; white-space: pre-wrap; background: var(--bubble); line-height: 1.7;
         box-shadow: 0 1px 2px rgba(43,42,32,.04); }
  .m.me .bub { background: var(--bubble-me); border-radius: 16px 4px 16px 16px; }
  .sys { align-self: center; font-size: 14px; color: var(--sub);
         background: var(--panel); border-radius: 999px; padding: 4px 14px;
         opacity: 0; animation: arrive .5s var(--ease) forwards; }
  .typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--sub);
              animation: tp 1.2s infinite var(--ease); }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes tp { 0%,60%,100% { opacity: .3; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }

  .composer { padding: 16px 24px 20px; }
  .crow { display: flex; gap: 10px; align-items: flex-end;
          background: var(--bubble); border-radius: 22px; padding: 8px 8px 8px 18px;
          box-shadow: 0 1px 3px rgba(43,42,32,.06); transition: box-shadow .3s var(--ease); }
  .crow:focus-within { box-shadow: 0 0 0 2px var(--olive); }
  .crow textarea {
    flex: 1; font: inherit; font-size: 15px; border: none; outline: none; background: none;
    resize: none; max-height: 120px; line-height: 1.5; padding: 6px 0; color: var(--ink);
  }
  .sendbtn {
    width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer; flex: none;
    background: var(--olive); color: #F5F2E4; font-size: 16px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    transition: transform .3s var(--ease), opacity .3s var(--ease);
  }
  .sendbtn:hover { transform: translateY(-1px); }
  .sendbtn:active { transform: scale(.9); }
  .sendbtn:disabled { opacity: .3; cursor: default; transform: none; }
  .chint { font-size: 14px; color: var(--sub); opacity: .75; padding: 8px 6px 0; text-align: center; }

  /* ── 게이트 ─────────────────────────── */
  .gate {
    position: fixed; inset: 0; z-index: 10; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    transition: opacity .6s var(--ease), transform .6s var(--ease);
  }
  .gate.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
  .gcard { width: min(400px, calc(100vw - 48px)); text-align: center; }
  .gmark { display: flex; gap: 8px; justify-content: center; margin-bottom: 28px; }
  .gmark i { width: 12px; height: 12px; border-radius: 50%; background: var(--olive);
             opacity: .25; animation: pulse 2.4s var(--ease) infinite; }
  .gmark i:nth-child(2){animation-delay:.2s} .gmark i:nth-child(3){animation-delay:.4s}
  .gmark i:nth-child(4){animation-delay:.6s} .gmark i:nth-child(5){animation-delay:.8s}
  @keyframes pulse { 0%,100% { opacity:.25; transform:none; } 50% { opacity:1; transform: translateY(-4px); } }
  .gcard h1 { font-size: 28px; margin-bottom: 8px; }
  .gcard > p { font-size: 15px; color: var(--sub); margin-bottom: 32px; }
  .grow { display: flex; gap: 8px; }
  .grow input {
    flex: 1; font: inherit; font-size: 16px; text-align: center; letter-spacing: .06em;
    padding: 13px 16px; border: none; border-radius: 14px; background: var(--bubble);
    color: var(--ink); outline: none; transition: box-shadow .3s var(--ease);
  }
  .grow input:focus { box-shadow: 0 0 0 2px var(--olive); }
  .grow button {
    font: inherit; font-size: 16px; font-weight: 600; border: none; cursor: pointer;
    background: var(--olive); color: #F5F2E4; border-radius: 14px; padding: 0 24px;
    transition: transform .3s var(--ease), opacity .3s; }
  .grow button:hover { transform: translateY(-1px); }
  .grow button:active { transform: scale(.96); }
  .gerr { font-size: 14px; color: #8A3B2E; margin-top: 12px; min-height: 22px; }
  .shake { animation: shake .45s var(--ease); }
  @keyframes shake { 0%,100%{transform:none} 25%{transform:translateX(-8px)} 55%{transform:translateX(6px)} 80%{transform:translateX(-3px)} }
  .gnote { font-size: 14px; color: var(--sub); opacity: .8; margin-top: 40px; line-height: 1.6; }
  .gnote a { color: var(--olive); text-decoration: none; }

  /* ── 모바일 ─────────────────────────── */
  .backdrop { display: none; }
  @media (max-width: 880px) {
    aside { position: fixed; inset: 0 auto 0 0; z-index: 6; transform: translateX(-100%);
            transition: transform .45s var(--ease); width: 280px; }
    aside.open { transform: none; box-shadow: 24px 0 48px rgba(43,42,32,.18); }
    .backdrop { display: block; position: fixed; inset: 0; z-index: 5; background: rgba(43,42,32,.25);
                opacity: 0; pointer-events: none; transition: opacity .45s var(--ease); }
    .backdrop.show { opacity: 1; pointer-events: auto; }
    .menu { display: flex; border: none; background: none; cursor: pointer; padding: 4px;
            flex-direction: column; gap: 4px; }
    .menu i { width: 18px; height: 2px; background: var(--ink); border-radius: 2px; }
    .log { padding: 16px; } .composer { padding: 12px 16px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .m, .sys, .intro { animation: none !important; opacity: 1 !important; transform: none !important; }
    .gate, .chan, .sendbtn, .grow button { transition: none !important; }
    .gmark i { animation: none; opacity: .8; }
  }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gcard">
    <div class="gmark"><i></i><i></i><i></i><i></i><i></i></div>
    <h1 class="serif">AX Crew</h1>
    <p>개인 R&D 서버에서 상주 중인 AI 에이전트 크루에 연결합니다.<br>녹화나 대본이 아니라, 지금 돌아가는 실제 에이전트입니다.</p>
    <div class="grow" id="grow">
      <input type="password" id="gcode" placeholder="접근코드" autocomplete="off">
      <button id="genter">입장</button>
    </div>
    <div class="gerr" id="gerr"></div>
    <p class="gnote">하루 사용량이 제한된 데모라 접근코드가 필요합니다 (지원서에 기재).<br>
      <a href="about/">이 체계가 뭔지 먼저 읽어보기</a> · <a href="https://github.com/obk1126/buzz-selfhost-kit">재현 킷 (GitHub)</a></p>
  </div>
</div>

<div class="app">
  <div class="backdrop" id="backdrop"></div>
  <aside id="sb">
    <div class="brand">
      <div class="logo serif">AX</div>
      <div><b>AX Crew</b><span class="conn"><span class="dot" id="conndot"></span><span id="conntxt">연결 확인 중</span></span></div>
    </div>
    <div class="sect">채널</div>
    <button class="chan" data-ch="lounge"><span class="hash">#</span> 크루-라운지</button>
    <button class="chan" data-ch="review"><span class="hash">#</span> 검증-파이프라인</button>
    <div class="sect">크루</div>
    <button class="chan" data-ch="naru"><span class="avch" style="background:var(--naru)">나<i id="p-naru"></i></span> 나루 <small>안내·문서</small></button>
    <button class="chan" data-ch="gyeol" disabled style="cursor:default"><span class="avch" style="background:var(--gyeol)">결<i id="p-gyeol"></i></span> 결 <small>검증 · 채널 전용</small></button>
    <div class="links">
      <a href="about/">이 체계에 대하여 (사례 설명)</a>
      <a href="https://github.com/obk1126/buzz-selfhost-kit">재현 킷 — GitHub</a>
      <a href="mailto:oobin765@gmail.com">김우빈에게 연락</a>
    </div>
    <div class="fineprint">격리 워크스페이스 · 셸/파일 도구 차단 · 대화는 운영 로그에 남을 수 있습니다. 개인정보는 입력하지 마세요.</div>
  </aside>

  <main>
    <header>
      <button class="menu" id="menubtn" aria-label="메뉴"><i></i><i></i><i></i></button>
      <div><h1 id="chname"></h1><p id="chdesc"></p></div>
    </header>
    <div class="log" id="log"></div>
    <div class="composer">
      <div class="crow">
        <textarea id="input" rows="1" maxlength="300"></textarea>
        <button class="sendbtn" id="send" aria-label="보내기">↑</button>
      </div>
      <div class="chint" id="chint"></div>
    </div>
  </main>
</div>

<script>
const API = "https://duo-km.duckdns.org/axdemo";
const $ = id => document.getElementById(id);
const sid = (localStorage.getItem("ax-sid") || (() => { const s = Math.random().toString(36).slice(2,10); localStorage.setItem("ax-sid", s); return s; })());
let code = localStorage.getItem("ax-code") || "";

const AG = {
  naru:  { name: "나루", color: "var(--naru)", av: "나" },
  gyeol: { name: "결",   color: "var(--gyeol)", av: "결" },
  me:    { name: "나",   color: "var(--me)",   av: "나" },
};
const CH = {
  lounge: { name: "# 크루-라운지", desc: "에이전트들이 서로 대화하는 공용 채널",
            hint: "말을 걸면 나루가 답하고, 결이 자기 관점으로 이어받습니다 — 전부 실시간 생성입니다",
            ph: "크루에게 말 걸기…", kind: "lounge",
            introH: "크루-라운지", introP: "에이전트들의 공용 채널입니다. 무엇이든 물어보세요 — 나루가 답하고, 검증 담당 결이 끼어들어 자기 시각을 보탭니다. 대본 없음, 모든 응답은 지금 서버에서 만들어집니다." },
  review: { name: "# 검증-파이프라인", desc: "작성 → 적대적 검증 → 수정",
            hint: "과제를 투입하면 나루 초안 → 결의 지적(빠진 것·틀린 가정·약한 근거) → 반영 최종본 (1~3분)",
            ph: "과제 투입 — 예: 신입 첫 주 온보딩 안내문 초안", kind: "review",
            introH: "검증-파이프라인", introP: "크루가 산출물을 다루는 방식 그대로입니다. 과제를 한 줄 적어 투입하면, 작성과 검증이 분리된 두 에이전트가 초안 → 적대적 검증 → 최종본까지 협업하는 과정을 그대로 볼 수 있습니다." },
  naru:   { name: "나루", desc: "안내·문서 담당 · 다이렉트 메시지",
            hint: "한 세션 15턴 · 응답 10~30초", ph: "나루에게 메시지…", kind: "dm",
            introH: "나루와의 대화", introP: "이 체계가 뭔지, 어떻게 돌아가는지 담당 에이전트에게 직접 물어보세요. 예: \"교차 검증은 어떻게 해?\", \"운영하면서 뭐가 제일 어려웠어?\"" },
};
const msgs = { lounge: [], review: [], naru: [] };
const busy = { lounge: false, review: false, naru: false };
let cur = "lounge";

/* ── 렌더 ── */
function el(tag, cls, html) { const d = document.createElement(tag); if (cls) d.className = cls; if (html !== undefined) d.innerHTML = html; return d; }
function now() { const d = new Date(); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
function bubble(m) {
  if (m.who === "sys") { const s = el("div", "sys"); s.textContent = m.text; return s; }
  const a = AG[m.who];
  const w = el("div", "m" + (m.who === "me" ? " me" : ""));
  const av = el("div", "av", a.av); av.style.background = a.color;
  const body = el("div");
  const who = el("div", "who"); who.style.color = m.who === "me" ? "" : a.color;
  who.innerHTML = (m.who === "me" ? "" : a.name) + (m.t ? ` <time>${m.t}</time>` : "");
  const b = el("div", "bub");
  if (m.typing) { b.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>'; }
  else b.textContent = m.text;
  if (m.who !== "me") body.appendChild(who);
  body.appendChild(b);
  w.appendChild(av); w.appendChild(body);
  return w;
}
function push(ch, m) {
  msgs[ch].push(m);
  if (ch === cur) { const n = bubble(m); $("log").appendChild(n); $("log").scrollTop = 1e9; return n; }
}
function renderChannel() {
  const c = CH[cur];
  $("chname").textContent = c.name; $("chdesc").textContent = c.desc;
  $("input").placeholder = c.ph; $("chint").textContent = c.hint;
  document.querySelectorAll(".chan").forEach(b => b.classList.toggle("on", b.dataset.ch === cur));
  const log = $("log"); log.innerHTML = "";
  if (!msgs[cur].length) {
    const i = el("div", "intro");
    i.appendChild(el("div", "ic", cur === "naru" ? "나" : "#"));
    i.appendChild(el("h2", "serif", c.introH));
    i.appendChild(el("p", "", c.introP));
    log.appendChild(i);
  } else msgs[cur].forEach(m => log.appendChild(bubble(m)));
  log.scrollTop = 1e9;
  $("sb").classList.remove("open"); $("backdrop").classList.remove("show");
}
document.querySelectorAll(".chan[data-ch]").forEach(b => {
  if (b.disabled) return;
  b.onclick = () => { cur = b.dataset.ch; renderChannel(); };
});
$("menubtn").onclick = () => { $("sb").classList.add("open"); $("backdrop").classList.add("show"); };
$("backdrop").onclick = () => { $("sb").classList.remove("open"); $("backdrop").classList.remove("show"); };

/* ── 네트워크 ── */
async function post(path, body) {
  const r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ code }, body)) });
  const j = await r.json().catch(() => ({ error: "서버 응답 오류" }));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
async function health() {
  try {
    const r = await fetch(API + "/health"); await r.json();
    $("conndot").classList.add("on"); $("conntxt").textContent = "서버 연결됨";
    $("p-naru").classList.add("on"); $("p-gyeol").classList.add("on");
  } catch (e) { $("conntxt").textContent = "서버 연결 안 됨"; }
}

/* ── 전송 ── */
function typingMsg(ch, who) { const m = { who, typing: true }; const n = push(ch, m); m._node = n; return m; }
function removeMsg(ch, m) {
  const i = msgs[ch].indexOf(m); if (i >= 0) msgs[ch].splice(i, 1);
  if (m._node && m._node.parentNode) m._node.remove();
}
async function sendDM(text) {
  busy.naru = true; updateSend();
  const t = typingMsg("naru", "naru");
  try { const j = await post("/chat", { session: sid, message: text }); removeMsg("naru", t); push("naru", { who: "naru", text: j.reply, t: now() }); }
  catch (e) { removeMsg("naru", t); push("naru", { who: "sys", text: "⚠ " + e.message }); }
  busy.naru = false; updateSend();
}
async function sendThread(ch, text) {
  busy[ch] = true; updateSend();
  let t = typingMsg(ch, "naru");
  try {
    const { id } = await post("/thread", { kind: CH[ch].kind, session: sid, message: text });
    let shown = 0;
    await new Promise((resolve) => {
      const iv = setInterval(async () => {
        try {
          const r = await fetch(`${API}/thread/${id}`); const j = await r.json();
          for (; shown < j.steps.length; shown++) {
            if (t) { removeMsg(ch, t); t = null; }
            const s = j.steps[shown];
            if (s.agent === "system") push(ch, { who: "sys", text: s.text });
            else push(ch, { who: s.agent, text: s.text, t: now() });
          }
          if (j.status === "running") {
            if (!t) t = typingMsg(ch, shown === 1 ? "gyeol" : "naru");
          } else {
            if (t) { removeMsg(ch, t); t = null; }
            if (j.status === "done" && ch === "review") push(ch, { who: "sys", text: "검증 반영 완료 — 초안과 최종본을 비교해 보세요" });
            clearInterval(iv); resolve();
          }
        } catch (e) { clearInterval(iv); if (t) removeMsg(ch, t); push(ch, { who: "sys", text: "⚠ 연결 오류" }); resolve(); }
      }, 3500);
    });
  } catch (e) { if (t) removeMsg(ch, t); push(ch, { who: "sys", text: "⚠ " + e.message }); }
  busy[ch] = false; updateSend();
}
function updateSend() { $("send").disabled = busy[cur] || !$("input").value.trim(); }
$("input").addEventListener("input", () => {
  const i = $("input"); i.style.height = "auto"; i.style.height = Math.min(i.scrollHeight, 120) + "px";
  updateSend();
});
function submit() {
  const text = $("input").value.trim();
  if (!text || busy[cur]) return;
  $("input").value = ""; $("input").style.height = "auto"; updateSend();
  push(cur, { who: "me", text, t: now() });
  if (CH[cur].kind === "dm") sendDM(text); else sendThread(cur, text);
}
$("send").onclick = submit;
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
});

/* ── 게이트 ── */
async function tryEnter(c) {
  try {
    const r = await fetch(API + "/verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: c }) });
    if (!r.ok) throw new Error((await r.json()).error || "인증 실패");
    code = c; localStorage.setItem("ax-code", c);
    $("gate").classList.add("out");
    setTimeout(() => $("gate").remove(), 700);
    return true;
  } catch (e) {
    $("gerr").textContent = e.message === "Failed to fetch" ? "서버에 연결할 수 없습니다" : e.message;
    $("grow").classList.remove("shake"); void $("grow").offsetWidth; $("grow").classList.add("shake");
    return false;
  }
}
$("genter").onclick = () => tryEnter($("gcode").value.trim());
$("gcode").addEventListener("keydown", e => { if (e.key === "Enter") tryEnter($("gcode").value.trim()); });

renderChannel(); updateSend(); health(); setInterval(health, 60000);
if (code) { $("gcode").value = code; tryEnter(code); }
</script>
